[settings]
npm.package_manager = "bun"

[shell_alias]
npx = "bunx"

[tools]
bun = "1.4.4"

# --- Agent Skills ---

[tasks."skills:sync"]
description = "Agent Skill を skills-lock.json と完全同期 (lock に無いスキルは削除)。.agents/skills に実体を置き、.claude/skills から symlink する。リポジトリ内の skills/* もリンクする"
run = '''
rm -rf .agents/skills .claude/skills
bunx skills experimental_install
mkdir -p .claude/skills
for d in .agents/skills/*/; do
    [ -d "$d" ] || continue
    name=$(basename "$d")
    ln -s "../../.agents/skills/$name" ".claude/skills/$name"
done

# リポジトリ内の skills/* (このリポジトリ専用のスキル) もリンクする
for d in skills/*/; do
    [ -d "$d" ] || continue
    name=$(basename "$d")
    ln -s "../../skills/$name" ".agents/skills/$name"
    ln -s "../../skills/$name" ".claude/skills/$name"
done
'''

# --- reviewbuddy ---

[tasks.review]
description = "このリポジトリを開発中の reviewbuddy (src/cli.ts) で開く。後ろの引数は reviewbuddy に渡す (例: mise run review -- --open)"
run = "bun src/cli.ts ."

[tasks.share]
description = "このリポジトリを開発中の reviewbuddy でポート 4400 で開き、tailscale serve で tailnet に HTTPS の 8443 番で共有する。Ctrl+C で止めると共有も外す"
# Checked first: if reviewbuddy then failed to start, the EXIT trap would take
# down the share of the one already running. mise appends task arguments to the
# last line, so it must stay the reviewbuddy command.
run = '''
if nc -z 127.0.0.1 4400 2>/dev/null; then
  echo "Port 4400 is already in use (another reviewbuddy?)." >&2
  exit 1
fi
tailscale serve --bg --https=8443 4400
trap 'tailscale serve --https=8443 off' EXIT
trap 'exit 130' INT TERM
bun src/cli.ts . --port 4400
'''
